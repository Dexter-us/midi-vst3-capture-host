name: Build Windows MIDI VST3 Capture Host

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure x64 Release
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build host
        run: cmake --build build --config Release --parallel

      - name: Upload host executable
        uses: actions/upload-artifact@v4
        with:
          name: midi-vst3-capture-host-windows-x64
          path: build/**/Release/MIDI VST3 Capture Host.exe
          if-no-files-found: error
